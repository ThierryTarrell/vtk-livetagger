<style>
:root{--bg:#141416;--ink:#f1f1f2;--pitch:#0b0b0c;--card:#26262a;--line:#3d3d44;--gold:#f2b705;--red:#e0161f;--bad:#ff5a5f;--good:#3ddc84}
*{box-sizing:border-box}
body{margin:0;font:16px/1.3 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:env(safe-area-inset-bottom,0)}
button{font:inherit;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:8px;min-height:48px;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.97)}
header{position:sticky;top:0;z-index:5;background:var(--pitch);color:#fff;padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top,0));display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#clk{font:700 40px/1 ui-monospace,Consolas,monospace;letter-spacing:1px;cursor:pointer;min-width:120px}
#ph{font-size:13px;opacity:.85;flex:1;min-width:90px}
header button{background:#ffffff1f;border-color:#ffffff55;color:#fff;min-height:42px;padding:6px 12px}
header #main{background:var(--gold);color:#14231a;border-color:var(--gold);font-weight:700}
.wrap{display:grid;gap:12px;padding:10px;max-width:1200px;margin:auto}
@media(min-width:900px){.wrap{grid-template-columns:1.1fr .9fr}}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.tg button{font-weight:700;min-height:52px}
.tg button.on{background:var(--pitch);color:#fff;border-color:var(--pitch)}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;margin-bottom:10px}
.pg button{min-height:50px;font-size:14px;line-height:1.15}
.pg button.on,.pg button.on:active{background:var(--gold);border-color:#14231a;font-weight:700}
.ag{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}

const gkOk=c=>c['GK long success']+c['GK short success']+c['GK throw success'],gkAll=c=>gkOk(c)+c['GK long fail']+c['GK short fail']+c['GK throw fail'];
const fw=c=>{const s=c['Progressive pass success']+c['Final third pass success']+c['Box pass success'];return[s,s+c['Progressive pass fail']+c['Final third pass fail']+c['Box pass fail']]};
const M=[['Goals',c=>c.Goal+c['Penalty scored']],['Shots on target',sot],['Total shots',sh],['Big chances created',c=>c['Big chance']],['Key passes',c=>c['Key pass']],['Successful crosses',c=>c['Cross successful']],['Corners',c=>c.Corner],['Dribbles won',c=>c['Dribble won']],['Tackles won',c=>c['Tackle won']],['Interceptions',c=>c.Interception],['Ball recoveries',c=>c.Recovery],['Blocks',c=>c.Block],['Clearances',c=>c.Clearance],['Aerials won',c=>c['Aerial won']],['Keeper saves, claims, punches',c=>c.Save+c['GK claim']+c['GK punch']],['Fouls won',c=>c['Foul won']],['Attacking set pieces',c=>c.Corner+c['Free kick']+c['Throw-in']],['Set pieces leading to a shot',c=>c['SP shot']],['Set pieces leading to a goal',c=>c['SP goal']],['Press regains',c=>c['Press regain']+c['Counter-press regain']],['High regains (attacking third)',c=>c['High regains']],['Second balls won',c=>c['Second ball won']],['Shots inside the box',c=>c['Box shots']],['Headed shots',c=>c.Headers],['Long passes completed',c=>c['Long pass success']],['Progressive passes completed',c=>c['Progressive pass success']],['Final-third passes completed',c=>c['Final third pass success']],['Passes into box completed',c=>c['Box pass success']],
['Shot accuracy %',c=>pc(sot(c),sh(c),3),0,1],['Cross success %',c=>pc(c['Cross successful'],cr(c),3),0,1],['Dribble success %',c=>pc(c['Dribble won'],c['Dribble won']+c['Dribble lost'],3),0,1],['Tackle success %',c=>pc(c['Tackle won'],c['Tackle won']+c['Tackle lost'],3),0,1],['Aerial success %',c=>pc(c['Aerial won'],c['Aerial won']+c['Aerial lost'],3),0,1],['Long pass success %',c=>pc(c['Long pass success'],c['Long pass success']+c['Long pass fail'],3),0,1],['Forward pass success %',c=>pc(fw(c)[0],fw(c)[1],3),0,1],['Second ball success %',c=>pc(c['Second ball won'],c['Second ball won']+c['Second ball lost'],3),0,1],['Keeper distribution %',c=>pc(gkOk(c),gkAll(c),3),0,1],

function analysis(h){an=h;const f=cnt('F',h),o=cnt('O',h);
const rows=M.map(m=>{const a=m[1](f),b=m[1](o);if(a==null||b==null||a+b===0)return null;let d=(a-b)/Math.max(a+b,1);if(m[2])d=-d;return{n:m[0],a,b,d,pct:m[3]?'%':''}}).filter(Boolean).sort((x,y)=>y.d-x.d);
const top=rows.filter(r=>r.d>0).slice(0,5),bot=rows.filter(r=>r.d<0).reverse().slice(0,5);
const li=(l,cl)=>l.length?l.map(r=>`<div class="it ${cl}"><b>${r.n}</b>: ${esc(fN())} ${r.a}${r.pct} vs ${r.b}${r.pct}</div>`).join(''):'<div class="it">Nothing clear yet</div>';
const n=S.ev.filter(e=>!h||e.h===h).length;
$('#dlg').innerHTML=`<h2 style="margin:0 0 6px">${esc(fN())} vs ${esc(oN())}: ${h===1?'First half':h===2?'Second half':'Full match'}</h2>
<div class="hs">${[1,2,0].map(x=>`<button class="${x===h?'on':''}" onclick="analysis(${x})">${['Full match','First half','Second half'][x]}</button>`).join(' ')}</div>
${n<8?'<p>Only '+n+' events tagged, so treat this with caution.</p>':''}${S.clk.ph==='ft'?'<p style="color:var(--gold)">Full time. Tap Export CSV below to back up this match.</p>':''}
<div class="cols"><div><h3 class="good">Top 5, going well</h3>${li(top,'good')}</div><div><h3 class="bad">Bottom 5, where we are going wrong</h3>${li(bot,'bad')}</div></div>
${posHtml(h)}${terrHtml(h)}${playersHtml(h)}<h3>Full comparison</h3><table><tr><th></th><th>${esc(fN())}</th><th>${esc(oN())}</th></tr>${M.map(m=>{const a=m[1](f),b=m[1](o);return`<tr><td>${m[0]}</td><td>${a==null?'-':a}</td><td>${b==null?'-':b}</td></tr>`}).join('')}</table>
<div class="bar"><button onclick="report('v')">VTKSI report</button><button onclick="report('k')">Kwekwe report</button><button onclick="exportCsv()">Export CSV</button></div><div class="bar"><button onclick="$('#dlg').close()">Close</button></div>`;

function sqRows(a){const o=(v,x,l)=>`<option value="${v}" ${x===v?'selected':''}>${l}</option>`;return a.map(p=>`<div class="sr"><input class="sn" inputmode="numeric" placeholder="No." value="${esc(p.n)}"><input class="sm" placeholder="Player name" value="${esc(p.name)}"><select class="sx">${o('xi',p.r,'Starting XI')}${o('sub',p.r,'Sub')}${o('out',p.r,'Not in squad')}</select></div>`).join('')}
/* ---------- possession ---------- */
const AF=['Tackle won','Interception','Recovery','Aerial won','Foul won','Dribble won','Key pass','Cross successful','Corner','Big chance','Assist','Save','GK claim','Long pass success','Progressive pass success','Final third pass success','Box pass success','Free kick','Throw-in','Press regain','Counter-press regain','Second ball won'],
AO=['Turnover','Turnover led to chance','Turnover led to goal','Tackle lost','Dribble lost','Aerial lost','Foul committed','Offside','Cross unsuccessful','Shot off target','GK long fail','Long pass fail','Progressive pass fail','Final third pass fail','Box pass fail','Press beaten','Second ball lost'];
function auto(e){if(!S.clk.run||(S.clk.ph!=='h1'&&S.clk.ph!=='h2'))return;const o=e.tm==='F'?'O':'F';if(AF.includes(e.act))setPos(e.tm);else if(AO.includes(e.act))setPos(o);else if(['Goal','Penalty scored','Own goal'].includes(e.act))setPos('D')}
function setPos(s){const p=S.pos;if(p.cur===s)return;const n=el();if(p.cur!=='N'&&n>p.from)p.segs.push([p.from,n,p.cur,S.clk.half]);p.cur=s;p.from=n;save();R()}
function allSegs(){const p=S.pos,sg=p.segs.slice(),n=el();if(p.cur!=='N'&&n>p.from)sg.push([p.from,n,p.cur,S.clk.half]);return sg}
function posAcc(h){const a=Array.from({length:6},()=>({F:0,O:0,D:0}));allSegs().forEach(s=>{if(h&&s[3]!==h)return;for(let k=Math.floor(s[0]);k<Math.floor(s[1]);k++){const b=s[3]===1?Math.min(2,Math.floor(k/900)):3+Math.min(2,Math.max(0,Math.floor((k-2700)/900)));a[b][s[2]]++}});return a}
function posHtml(h){const a=posAcc(h),nm=['0-15','15-30','30-45+','46-60','60-75','75-90+'],tot={F:0,O:0,D:0};a.forEach(b=>{tot.F+=b.F;tot.O+=b.O;tot.D+=b.D});if(!(tot.F+tot.O+tot.D))return'';
const row=(l,x)=>{const s=x.F+x.O+x.D,f=v=>s?Math.round(v/s*100)+'%':'-';return`<tr><td>${l}</td><td>${f(x.F)}</td><td>${f(x.O)}</td><td>${f(x.D)}</td></tr>`};
return`<h3>Possession (share of tracked time)</h3><table><tr><th></th><th>${esc(fN())}</th><th>${esc(oN())}</th><th>Loose/out</th></tr>${row('Selection',tot)}${a.map((b,i)=>(h===0||(h===1&&i<3)||(h===2&&i>=3))?row(nm[i],b):'').join('')}</table>`}
function possRows(){const d=(S.cfg.date||new Date().toISOString().slice(0,10));return allSegs().map(s=>[fN()+' v '+oN(),d,s[3],fmt(s[0]),Math.floor(s[0]/60)+1,s[2]==='F'?fN():s[2]==='O'?oN():'Loose / out of play',s[2]==='F'?'focus':s[2]==='O'?'opposition':'','','','Possession spell','','','','','',Math.round(s[1]-s[0]),'',''])}
$('#pos').onclick=e=>{const b=e.target.closest('[data-p]');if(b&&(S.clk.ph==='h1'||S.clk.ph==='h2'))setPos(b.dataset.p)};
document.addEventListener('keydown',e=>{if((e.target.closest&&e.target.closest('input,select,textarea'))||$('#dlg').open)return;const ph=S.clk.ph;if(ph!=='h1'&&ph!=='h2')return;
if(e.code==='Space'){e.preventDefault();if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();setPos(S.pos.cur==='F'?'O':'F')}else if(e.key==='1')setPos('F');else if(e.key==='2')setPos('O');else if(e.key==='3')setPos('D')});
/* ---------- score + match library ---------- */
function score(){const f=cnt('F',0),o=cnt('O',0),g=c=>c.Goal+c['Penalty scored'];return{F:g(f)+o['Own goal'],O:g(o)+f['Own goal']}}
function scoreTxt(){const s=score(),h=S.cfg.focus==='home';return(h?s.F:s.O)+'-'+(h?s.O:s.F)}
function scoreHdr(){const s=score(),h=S.cfg.focus==='home',ab=n=>esc(n.replace(/[^A-Za-z0-9 ]/g,'').trim().slice(0,3).toUpperCase());$('#score').innerHTML=`<small title="${esc(S.cfg.home)}">${ab(S.cfg.home)}</small><b>${h?s.F:s.O}-${h?s.O:s.F}</b><small title="${esc(S.cfg.away)}">${ab(S.cfg.away)}</small>`}
function getIdx(){try{return JSON.parse(localStorage.getItem('vtk_idx'))||[]}catch(e){return[]}}
function idx(){const a=getIdx(),c=S.cfg,m={id:S.mid,title:c.home+' v '+c.away,date:c.date||'',comp:c.comp||'',score:scoreTxt(),n:S.ev.length},i=a.findIndex(x=>x.id===S.mid);if(i>=0)a[i]=m;else a.push(m);localStorage.setItem('vtk_idx',JSON.stringify(a))}
function freeze(){const n=el(),p=S.pos;if(p.cur!=='N'&&n>p.from)p.segs.push([p.from,n,p.cur,S.clk.half]);p.cur='N';S.clk.base=n;S.clk.run=false}
function newMatch(){freeze();save();const c={...S.cfg};delete c.date;delete c.comp;S={cfg:c,ev:[],clk:{run:false,base:0,at:0,half:1,ph:'pre'},last:null,pos:{cur:'N',from:0,segs:[]},mid:String(Date.now())};sel={t:'F',k:null};save();$('#dlg').close();R();$('#setup').click()}
function openMatch(id){if(id===S.mid){$('#dlg').close();return}const raw=localStorage.getItem('vtk_m_'+id);if(!raw){alert('That match could not be found.');return}freeze();save();S=JSON.parse(raw);if(!S.pos)S.pos={cur:'N',from:0,segs:[]};S.mid=id;sel={t:'F',k:null};save();$('#dlg').close();R()}
async function exportOther(id){if(id===S.mid)return exportCsv();const raw=localStorage.getItem('vtk_m_'+id);if(!raw)return;const keep=S;S=JSON.parse(raw);if(!S.pos)S.pos={cur:'N',from:0,segs:[]};freeze();try{await exportCsv()}finally{S=keep}}
function matchesDlg(){const a=getIdx().sort((x,y)=>(y.date||'').localeCompare(x.date||'')||String(y.id).localeCompare(String(x.id)));
$('#dlg').innerHTML=`<h2 style="margin:0">Match library</h2><p style="font-size:13px;opacity:.75">Every match saves on this device automatically. Export a CSV as a backup, because clearing the browser data would erase the library.</p><div class="bar"><button id="mn" style="background:var(--red);color:#fff">Save this and start a new match</button><button id="ms">Season view</button></div>`+(a.map(m=>`<div class="lr" style="${m.id===S.mid?'border-left:4px solid var(--red)':''}"><span><b style="min-width:0">${esc(m.title)}</b> ${esc(m.score)}<br><small>${esc(m.date)} ${esc(m.comp)} · ${m.n} events${m.id===S.mid?' · open now':''}</small></span><button data-o="${m.id}">Open</button><button data-c="${m.id}">CSV</button><button data-x="${m.id}">✕</button></div>`).join('')||'<div class="lr">Nothing saved yet</div>')+`<div class="bar"><button onclick="$('#dlg').close()">Close</button></div>`;
$('#dlg').showModal();$('#mn').onclick=newMatch;$('#ms').onclick=seasonDlg}
$('#mt').onclick=matchesDlg;
$('#dlg').addEventListener('click',e=>{const b=e.target.closest('[data-o],[data-c],[data-x]');if(!b)return;if(b.dataset.o)openMatch(b.dataset.o);else if(b.dataset.c)exportOther(b.dataset.c);else if(b.dataset.x){if(b.dataset.x===S.mid){alert('This match is open. Start a new match first, then delete it.');return}if(confirm('Delete this saved match permanently?')){localStorage.removeItem('vtk_m_'+b.dataset.x);localStorage.setItem('vtk_idx',JSON.stringify(getIdx().filter(m=>m.id!==b.dataset.x)));matchesDlg()}}});

window.addEventListener('error',e=>{try{const b=document.createElement('div');b.style.cssText='position:fixed;left:8px;right:8px;bottom:8px;background:#b3261e;color:#fff;padding:10px;border-radius:8px;z-index:99;font-size:13px';b.textContent='Error: '+e.message+' (tap to hide, screenshot it for VTK)';b.onclick=()=>b.remove();document.body.appendChild(b)}catch(x){}});
function playerRows(h){const c=S.cfg,end=Math.max(el(),...S.ev.map(e=>e.t),0),m={};
parse(c.fxi).forEach(p=>m[key(p)]={n:p.n,name:p.name,f:0,t:end});
S.ev.filter(e=>e.act==='Sub'&&e.tm==='F').sort((a,b)=>a.t-b.t).forEach(e=>{if(m[e.ok])m[e.ok].t=e.t;const q=parse(c.fbn).find(p=>key(p)===e.nk);if(q)m[e.nk]={n:q.n,name:q.name,f:e.t,t:end}});
const r=Object.keys(m).map(k=>({k,...m[k],g:0,s:0,kp:0,d:0,to:0,a:0}));
S.ev.filter(e=>e.tm==='F'&&e.act!=='Sub'&&(!h||e.h===h)).forEach(e=>{const x=r.find(y=>y.k===(e.pn||'')+'|'+(e.pl||''));if(!x)return;const a=e.act;x.a++;
if(a==='Goal'||a==='Penalty scored')x.g++;if(['Shot on target','Shot off target','Shot blocked','Goal','Penalty scored','Penalty missed'].includes(a))x.s++;if(a==='Key pass')x.kp++;
if(['Tackle won','Interception','Block','Clearance','Recovery','Press regain','Counter-press regain'].includes(a))x.d++;if(['Turnover','Turnover led to chance','Turnover led to goal'].includes(a))x.to++});
r.forEach(x=>{x.min=Math.max(0,Math.round((x.t-x.f)/60))});return r}
function playersHtml(h){const r=playerRows(h).filter(x=>x.min>0||x.a);if(!r.length)return'';
return`<h3>Players: ${esc(fN())} (minutes come from your subs)</h3><div style="overflow-x:auto"><table><tr><th>Player</th><th>Min</th><th>Goals</th><th>Shots</th><th>Key p.</th><th>Def.</th><th>Lost</th><th>Acts/90</th></tr>${r.map(x=>`<tr><td>${esc(lab(x.n,x.name))}</td><td>${x.min}</td><td>${x.g}</td><td>${x.s}</td><td>${x.kp}</td><td>${x.d}</td><td>${x.to}</td><td>${x.min?Math.round(x.a*90/x.min):'-'}</td></tr>`).join('')}</table></div>`}
function seasonDlg(){const keep=S,team=fN(),rows=[],pl={};
try{getIdx().forEach(m=>{const raw=localStorage.getItem('vtk_m_'+m.id);if(!raw)return;S=JSON.parse(raw);if(!S.pos)S.pos={cur:'N',from:0,segs:[]};if(fN()!==team)return;freeze();
const f=cnt('F',0),o=cnt('O',0),sc=score();let pf=0,po=0;posAcc(0).forEach(b=>{pf+=b.F;po+=b.O});
rows.push({d:S.cfg.date||'',o:oN(),gf:sc.F,ga:sc.O,sh:sh(f),sot:sot(f),sha:sh(o),bc:f['Big chance'],pp:pf+po?Math.round(pf/(pf+po)*100):null});
playerRows(0).forEach(x=>{const k=lab(x.n,x.name),z=pl[k]||(pl[k]={k,m:0,min:0,g:0,s:0,kp:0,d:0,to:0});if(x.min>0)z.m++;z.min+=x.min;z.g+=x.g;z.s+=x.s;z.kp+=x.kp;z.d+=x.d;z.to+=x.to})})}finally{S=keep}
rows.sort((a,b)=>a.d.localeCompare(b.d));const n=rows.length||1,sum=k=>rows.reduce((a,r)=>a+(r[k]||0),0),W=rows.filter(r=>r.gf>r.ga).length,D=rows.filter(r=>r.gf===r.ga).length,pv=rows.filter(r=>r.pp!=null),av=k=>(sum(k)/n).toFixed(1);
const pr=Object.values(pl).sort((a,b)=>b.min-a.min);
$('#dlg').innerHTML=`<h2 style="margin:0">Season: ${esc(team)}</h2>`+(rows.length?`<p>${rows.length} matches · W${W} D${D} L${rows.length-W-D} · goals ${sum('gf')}-${sum('ga')}</p><div style="overflow-x:auto"><table><tr><th>Date</th><th>Opponent</th><th>For-Ag.</th><th>Shots</th><th>SoT</th><th>Opp sh.</th><th>Big ch.</th><th>Poss%</th></tr>${rows.map(r=>`<tr><td>${esc(r.d)}</td><td>${esc(r.o)}</td><td>${r.gf}-${r.ga}</td><td>${r.sh}</td><td>${r.sot}</td><td>${r.sha}</td><td>${r.bc}</td><td>${r.pp==null?'-':r.pp}</td></tr>`).join('')}<tr><th>Average</th><th></th><th>${av('gf')}-${av('ga')}</th><th>${av('sh')}</th><th>${av('sot')}</th><th>${av('sha')}</th><th>${av('bc')}</th><th>${pv.length?Math.round(pv.reduce((a,r)=>a+r.pp,0)/pv.length):'-'}</th></tr></table></div><h3>Players across matches</h3><div style="overflow-x:auto"><table><tr><th>Player</th><th>Apps</th><th>Min</th><th>Goals</th><th>Shots</th><th>Key p.</th><th>Def.</th><th>Lost</th></tr>${pr.map(z=>`<tr><td>${esc(z.k)}</td><td>${z.m}</td><td>${z.min}</td><td>${z.g}</td><td>${z.s}</td><td>${z.kp}</td><td>${z.d}</td><td>${z.to}</td></tr>`).join('')}</table></div>`:'<p>No saved matches for this team yet.</p>')+`<div class="bar"><button onclick="matchesDlg()">Back</button><button onclick="$('#dlg').close()">Close</button></div>`;
if(!$('#dlg').open)$('#dlg').showModal()}

function rankRows(h){const f=cnt('F',h),o=cnt('O',h);return M.map(m=>{const a=m[1](f),b=m[1](o);if(a==null||b==null||a+b===0)return null;let d=(a-b)/Math.max(a+b,1);if(m[2])d=-d;return{n:m[0],a,b,d,pct:m[3]?'%':''}}).filter(Boolean).sort((x,y)=>y.d-x.d)}
function repCss(th){return`.rp{font:14px/1.4 "Segoe UI",system-ui,sans-serif;color:#111;background:#fff;max-width:900px;margin:auto;padding-bottom:20px}
.rp .hd{background:${th.h};color:#fff;padding:14px 18px;display:flex;align-items:center;gap:14px;border-bottom:5px solid ${th.a}}.rp .hd h1{margin:0;font-size:21px}.rp .hd small{opacity:.85}
.rp .sc{display:flex;justify-content:center;align-items:center;gap:16px;padding:14px;font-size:17px;font-weight:600;text-align:center}.rp .sc b{font-size:38px;color:${th.a}}
.rp h3{margin:18px 18px 6px;padding-bottom:4px;border-bottom:2px solid ${th.a};font-size:15px;color:${th.h}}
.rp table{width:calc(100% - 36px);margin:0 18px;border-collapse:collapse;font-size:13px}.rp th{background:${th.h};color:#fff;padding:5px 7px;text-align:right}.rp td{padding:4px 7px;border-bottom:1px solid #ddd;text-align:right}.rp td:first-child,.rp th:first-child{text-align:left}
.rp .two{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 18px}.rp .mv{margin:0 18px;padding:3px 0;border-bottom:1px solid #eee}.rp .two .mv{margin:0}.rp .rg{color:#1b7a3d}.rp .rb{color:#b3261e}
.rp .mp{padding:0 18px}.rp svg{width:100%;display:block;border:1px solid #ccd}.rp .ft{margin:18px;font-size:11px;color:#666;text-align:center}@media(max-width:560px){.rp .two{grid-template-columns:1fr}}`}
function pitchSvg(items,th){const d=items.map(i=>`<circle cx="${Math.min(103,Math.max(2,i.x*1.05)).toFixed(1)}" cy="${Math.min(66,Math.max(2,i.y*.68)).toFixed(1)}" r="${i.r}" fill="${i.f}" stroke="${i.s||th.h}" stroke-width=".35"/>`).join('');
return`<svg viewBox="0 0 105 68"><rect width="105" height="68" fill="#eef2ec"/><g fill="none" stroke="#9aa39a" stroke-width=".35"><rect x=".5" y=".5" width="104" height="67"/><path d="M52.5 .5V67.5"/><circle cx="52.5" cy="34" r="9.15"/><rect x=".5" y="13.85" width="16.5" height="40.3"/><rect x="88" y="13.85" width="16.5" height="40.3"/><path d="M35 .5V67.5M70 .5V67.5" stroke-dasharray="1 1"/></g>${d}</svg>`}
function report(br){$('#dlg').close();const K=br==='k',th=K?{h:'#0b1f7a',a:'#2a7fd4',g:'#f2c200',on:'#2a7fd4',logo:KLOGO}:{h:'#1a1a1a',a:'#d4141c',g:'#d4141c',on:'#3b7fd8',logo:LOGO};
const c=S.cfg,sc=score(),fh=c.focus==='home',hs=fh?sc.F:sc.O,as=fh?sc.O:sc.F,f0=cnt('F',0),o0=cnt('O',0),f1=cnt('F',1),f2=cnt('F',2);
const MV=['Goal','Penalty scored','Penalty missed','Own goal','Yellow','Red','Sub','Big chance','Turnover led to goal'];
const mv=S.ev.filter(e=>MV.includes(e.act)).sort((a,b)=>a.t-b.t).map(e=>`<div class="mv"><b>${Math.floor(e.t/60)+1}'</b> ${e.act==='Sub'?'Sub, '+esc(lab(e.pn,e.pl))+' on for '+esc(e.off):esc(e.act==='Yellow'?'Yellow card':e.act==='Red'?'Red card':e.act)+(e.pn||e.pl?', '+esc(lab(e.pn,e.pl)):'')} <i>(${esc(tN(e.tm))})</i></div>`).join('')||'<div class="mv">No key moments tagged.</div>';
const val=(m,x)=>{const v=m[1](x);return v==null?null:v+(m[3]?'%':'')};
const cmp=M.map(m=>[m[0],val(m,f0),val(m,o0)]).filter(r=>(r[1]!=null||r[2]!=null)&&!(parseInt(r[1])===0&&parseInt(r[2])===0));
const hv=M.map(m=>[m[0],val(m,f1),val(m,f2),val(m,f0)]).filter(r=>r.slice(1).some(v=>v!=null&&parseInt(v)>0));
const tb=(h,rows)=>`<table><tr>${h.map(x=>`<th>${esc(x)}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(v=>`<td>${v==null?'-':esc(v)}</td>`).join('')}</tr>`).join('')}</table>`;
const rk=rankRows(0),li=(l,cl)=>l.map(r=>`<div class="mv ${cl}"><b>${esc(r.n)}</b>: ${r.a}${r.pct} vs ${r.b}${r.pct}</div>`).join('')||'<div class="mv">Nothing clear</div>';
const SA=['Shot on target','Shot off target','Shot blocked','Goal','Penalty scored','Penalty missed'],gl=a=>a==='Goal'||a==='Penalty scored',lc=e=>e.tm==='F'&&e.x!=null;
const sh1=S.ev.filter(e=>lc(e)&&SA.includes(e.act)).map(e=>({x:e.x,y:e.y,r:gl(e.act)?2.4:1.6,f:gl(e.act)?th.g:e.act==='Shot on target'?th.on:e.act==='Shot blocked'?'#999':'#fff',s:e.act==='Shot off target'||e.act==='Penalty missed'?th.on:th.h}));
const to1=S.ev.filter(e=>lc(e)&&/^Turnover/.test(e.act)).map(e=>({x:e.x,y:e.y,r:e.act==='Turnover led to goal'?2.4:e.act==='Turnover led to chance'?1.9:1.3,f:e.act==='Turnover led to goal'?th.g:e.act==='Turnover led to chance'?th.on:'#888'}));
const mp=(a,l)=>a.length?pitchSvg(a,th)+`<div style="font-size:12px;color:#555;margin-top:4px">${l}</div>`:'<div style="font-size:13px;color:#777">Nothing located on the pitch yet.</div>';
const inner=`<div class="rp"><style>${repCss(th)}</style><div class="hd">${th.logo}<div><h1>Post-match report</h1><small>${esc(c.home)} v ${esc(c.away)}${c.date?' · '+esc(c.date):''}${c.comp?' · '+esc(c.comp):''}${K?' · Analysis by VTK Sports Intelligence':''}</small></div></div>
<div class="sc"><span>${esc(c.home)}</span><b>${hs}-${as}</b><span>${esc(c.away)}</span></div>
<h3>Key moments</h3>${mv}
<div class="two"><div><h3 style="margin:18px 0 6px">Going well</h3>${li(rk.filter(r=>r.d>0).slice(0,5),'rg')}</div><div><h3 style="margin:18px 0 6px">Where we went wrong</h3>${li(rk.filter(r=>r.d<0).reverse().slice(0,5),'rb')}</div></div>
<h3>Team comparison</h3>${tb(['',fN(),oN()],cmp)}
<h3>${esc(fN())}: first half v second half</h3>${tb(['','1st half','2nd half','Full match'],hv)}
${posHtml(0)}${terrHtml(0)}${playersHtml(0)}
<h3>Shot map: ${esc(fN())} attacking right</h3><div class="mp">${mp(sh1,'Large solid = goal, filled = on target, hollow = off target, grey = blocked.')}</div>
<h3>Turnover map: ${esc(fN())}</h3><div class="mp">${mp(to1,'Small grey = turnover, blue = led to a big chance, large coloured = led to a goal.')}</div>
<div class="ft">Analysis by VTK Sports Intelligence · ${esc(c.home)} v ${esc(c.away)}</div></div>`;
window._rdoc='<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(c.home+' v '+c.away)+'</title></head><body style="margin:0;background:#fff">'+inner+'</body></html>';
